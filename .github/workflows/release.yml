name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - uses: astral-sh/setup-uv@v5
      - name: Verify tag matches app version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$TAG_NAME" = "v$APP_VERSION"
      - name: Test
        run: xcrun swift test
      - name: Build bundled app
        run: ./scripts/build-app.sh
      - name: Package and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/YouTube Cleaner.app" "dist/YouTube-Cleaner-macOS.zip"
          shasum -a 256 "dist/YouTube-Cleaner-macOS.zip" > "dist/YouTube-Cleaner-macOS.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            "dist/YouTube-Cleaner-macOS.zip" \
            "dist/YouTube-Cleaner-macOS.zip.sha256" \
            --title "YouTube Cleaner $TAG_NAME" \
            --generate-notes
